# Install as /etc/systemd/journald.conf.d/zz-mutinynet.conf, then
# `systemctl restart systemd-journald`.
#
# The zz- prefix is load-bearing. systemd merges drop-ins in filename order
# regardless of directory, and rsyslog ships
# /usr/lib/systemd/journald.conf.d/syslog.conf. Any name sorting before
# "syslog.conf" loses ForwardToSyslog to it.
#
# Container logs use the journald driver (docker-compose.yml x-logging), so
# the journal is the only log store. Bound it so it cannot fill the disk.
[Journal]
Storage=persistent
SystemMaxUse=10G
SystemKeepFree=20G
MaxRetentionSec=30day
# Every container logs through docker.service. The default burst of 10000
# messages per 30s would drop lines from every container when one is chatty.
RateLimitIntervalSec=30s
RateLimitBurst=100000
# Without this, journald also mirrors every container line to rsyslog, which
# writes it to BOTH /var/log/syslog (*.*) and /var/log/user.log (user.*).
# Nothing bounds those: they reached 30G at 3.2G/day.
#
# journald owns /dev/log, so this silences rsyslog entirely -- /var/log/syslog,
# auth.log and kern.log stop being written. Read the journal instead
# (`journalctl -u ssh`, `journalctl -k`). fail2ban is already on
# `backend = systemd` (jail.d/defaults-debian.conf) and reads the journal
# directly, so it is unaffected; check that before adding any tool that
# expects to tail a file under /var/log.
ForwardToSyslog=no
