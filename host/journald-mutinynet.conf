# Install as /etc/systemd/journald.conf.d/mutinynet.conf, then
# `systemctl restart systemd-journald`.
#
# Container logs use the journald driver (docker-compose.yml x-logging), so
# the journal is the only log store. Bound it so it cannot fill the disk.
[Journal]
Storage=persistent
SystemMaxUse=10G
SystemKeepFree=20G
MaxRetentionSec=30day
# Every container logs through docker.service. The default burst of 10000
# messages per 30s would drop lines from every container when one is chatty.
RateLimitIntervalSec=30s
RateLimitBurst=100000
