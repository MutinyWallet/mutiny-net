# Public Electrum TCP endpoint, proxied with connection limits.
#
# Include this file from nginx.conf at the top level (outside http {}):
#   include /root/mutiny-net/nginx/electrum-stream.conf;
# It needs the stream module (nginx-full on Debian, or load
# ngx_stream_module.so). docker-compose.yml binds electrs to 127.0.0.1:50003,
# so this listener is the only public path to it.
#
# The websocat bridge for /electrum-websocket runs on the host and connects
# from 127.0.0.1. Every websocket user shares that address, so loopback is
# exempt from the per-IP cap.
stream {
    map $remote_addr $electrum_client {
        default   $binary_remote_addr;
        127.0.0.1 "";
        ::1       "";
    }
    limit_conn_zone $electrum_client zone=electrum_per_ip:10m;
    limit_conn_zone $server_addr zone=electrum_total:1m;

    server {
        listen 50001;
        listen [::]:50001;
        limit_conn electrum_per_ip 8;
        limit_conn electrum_total 1000;
        proxy_connect_timeout 5s;
        # Idle timeout. Electrum clients ping about once a minute.
        proxy_timeout 10m;
        proxy_pass 127.0.0.1:50003;
    }
}
