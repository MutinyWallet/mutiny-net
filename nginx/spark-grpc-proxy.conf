# Shared gRPC proxy settings for the Spark operator vhosts.
# The including server block sets $spark_upstream.
grpc_pass $spark_upstream;
grpc_set_header Host $host;
grpc_set_header X-Real-IP $remote_addr;
grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
grpc_set_header X-Forwarded-Proto $scheme;

# Server-streaming subscriptions stay open, so keep the read timeout long.
# No Spark RPC streams from the client, so request bodies must arrive promptly.
grpc_read_timeout 300;
grpc_send_timeout 300;
client_body_timeout 30;
client_max_body_size 1m;

grpc_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
