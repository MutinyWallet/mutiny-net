# Deployed as /etc/nginx/nginx.conf (a symlink) by nginx/deploy.sh.
# Vhosts live beside this file and are linked into sites-available.
user root;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	ssl_protocols TLSv1.2 TLSv1.3;
	include /root/mutiny-net/nginx/hsts.conf;
	include /root/mutiny-net/nginx/cloudflare-realip.conf;
	ssl_prefer_server_ciphers on;

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	gzip on;

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}

stream {
	include /root/mutiny-net/nginx/electrum-stream.conf;

	# Electrum over TLS. Shares the connection limits defined in the include.
	upstream electrs {
		server 127.0.0.1:50003;
	}

	server {
		listen 50002 ssl;
		proxy_pass electrs;
		limit_conn electrum_per_ip 8;
		limit_conn electrum_total 1000;

		ssl_certificate /etc/letsencrypt/live/mutinynet.com/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/mutinynet.com/privkey.pem;
		ssl_session_cache shared:SSL:1m;
		ssl_session_timeout 4h;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers on;
	}
}
